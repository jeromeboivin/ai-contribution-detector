[project]
name = "aicontrib"
version = "0.1.0"
description = "Classify whether code was written by a human, co-authored, or fully AI-generated"
requires-python = ">=3.10"
dependencies = [
    # >=2.6: transformers refuses torch.load of .bin weights (our encoder's only format) below 2.6
    "torch>=2.6",
    "transformers>=4.40",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "GitPython>=3.1",
    "unidiff>=0.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
aicontrib = "aicontrib.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicontrib = ["static/*.html", "data/*.npz", "data/*.json"]
