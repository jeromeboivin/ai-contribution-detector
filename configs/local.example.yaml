# Personal settings. Copy this file to configs/local.yaml (never committed to git) and
# uncomment what you need. Anything here overrides configs/default.yaml -- only the keys you
# set; everything else keeps its default. Editing local.yaml instead of default.yaml means
# `git pull` never conflicts with your changes.
#
# Each section below starts with a top-level key (`dataset:`, `training:`, `known_repos:`).
# Write each key only once: to use two options of the same section, put them under the same
# key, e.g.
#   dataset:
#     per_class_cap: {train: 10000, validation: 1000, test: 1000}
#     languages: {include: [Python, JavaScript, C++, C#]}
#   training:
#     early_stopping_patience: 30

# ---- Quick prototype: train on a subset of the data ---------------------------------
# The full dataset (~2.3M samples) can take days to embed. Rows are capped per class and per
# split; 10000/1000/1000 is ~36,000 samples (~1.5% of the data, so ~1/60th of the time) and
# gives balanced classes. Remove these lines (or set them to null) to go back to the full data.
#
# dataset:
#   per_class_cap:
#     train: 10000
#     validation: 1000
#     test: 1000

# ---- Train only on some programming languages ----------------------------------------
# Applies to every split (train, validation, test). Use `include` (keep only these) or
# `exclude` (keep everything but these). Names are case-insensitive:
# C, C#, C++, Go, Java, JavaScript, PHP, Python, Rust, Ruby, HTML.
# The README's "Languages in the training data" table shows how much data each one has.
# Re-run `aicontrib prepare` (then embed/train) after changing this.
#
# dataset:
#   languages:
#     include: [Python, JavaScript, C++, C#]
#     # exclude: [Rust, Ruby, HTML]
#
# (If you also use per_class_cap above, put both under the same single `dataset:` key.)

# ---- Training: when to stop, and how fast to learn ------------------------------------
# Only `aicontrib train` needs re-running after changing these (then `evaluate`); the
# embeddings are reused. Each epoch takes seconds, and only the best epoch (highest
# validation macro-F1) is saved, so training longer never makes the saved model worse.
# Watch the validation macro-F1 chart at http://127.0.0.1:8765 while training:
#   - still rising when training stops   -> raise early_stopping_patience
#   - jumping up and down a lot           -> lower lr (e.g. 0.0003)
#   - flat for dozens of epochs           -> more epochs won't help; more/other data might
#
# training:
#   epochs: 200                   # hard upper limit on training length
#   early_stopping_patience: 20   # stop after this many epochs without a new best score
#   lr: 0.001                     # learning rate: size of each learning step
#   lr_reduce_patience: 5         # halve the learning rate after this many epochs without progress...
#   lr_reduce_factor: 0.5         # ...by this factor...
#   min_lr: 0.00001               # ...but never below this
#
# Keep lr_reduce_patience well below early_stopping_patience (e.g. 5 vs 20): the learning
# rate then gets reduced a few times -- smaller, finer steps -- before training gives up.

# ---- Repos with known authorship, for `aicontrib evaluate-repo --all` ----------------
# `path` is an absolute path to a local git clone; `expected_class` is human / co_authored / ai.
# Optional `since` / `until` (dates, e.g. 2021-12-31) limit an entry to part of the history -- useful
# for a big repo, or one whose authorship changed over time: list it twice, e.g. a `human` entry
# with `until: 2021-12-31` and an `ai` entry with `since: 2025-01-01`, under different names.
# evaluate-repo then samples only commits in the range; binoculars only files created in it.
#
# Path syntax
#   Linux / macOS:  path: "/home/me/repos/tslint"
#   Windows -- use ONE of these three forms:
#     path: 'C:\Users\me\repos\tslint'     # single quotes: backslashes are taken literally
#     path: "C:/Users/me/repos/tslint"     # forward slashes: work fine on Windows, any quotes
#     path: "C:\\Users\\me\\repos\\tslint" # double quotes need every backslash doubled
#   Do NOT write  path: "C:\Users\me\repos\tslint"  -- inside double quotes YAML reads
#   backslashes as escape sequences (\U, \r, \t...) and the whole config fails to load.
#
# known_repos:
#   - name: tslint
#     path: 'C:\Users\me\repos\tslint'  # git clone https://github.com/palantir/tslint.git
#     expected_class: human
#   - name: my-private-ai-repo
#     path: 'C:\Users\me\repos\my-private-ai-repo'
#     expected_class: ai
#   - name: big-repo-before-ai
#     path: 'C:\Users\me\repos\big-repo'
#     expected_class: human
#     since: 2019-01-01
#     until: 2021-12-31
