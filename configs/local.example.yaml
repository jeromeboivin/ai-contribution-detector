# Copy this file to configs/local.yaml (already in .gitignore) and fill in real local paths.
# Entries here are appended to `known_repos` from configs/default.yaml -- see README
# "Real-world validation against known-authorship repos".
#
# `path` must be an absolute path to a local git clone. `expected_class` is one of
# human / co_authored / ai -- whatever you know for certain about that repo's authorship.
#
# Path syntax
# -----------
# Linux / macOS:  path: "/home/me/repos/tslint"
#
# Windows -- use ONE of these three forms:
#   path: 'C:\Users\me\repos\tslint'     # single quotes: backslashes are taken literally
#   path: "C:/Users/me/repos/tslint"     # forward slashes: work fine on Windows, any quotes
#   path: "C:\\Users\\me\\repos\\tslint" # double quotes need every backslash doubled
#
# Do NOT write  path: "C:\Users\me\repos\tslint"  -- inside double quotes YAML reads
# backslashes as escape sequences (\U, \r, \t...) and the whole config fails to load.

known_repos:
  - name: tslint
    path: "/absolute/path/to/tslint"  # git clone https://github.com/palantir/tslint.git
    # path: 'C:\Users\me\repos\tslint'  # Windows equivalent
    expected_class: human

  - name: my-private-ai-repo
    path: "/absolute/path/to/your/private/repo"
    # path: 'C:\Users\me\repos\my-private-ai-repo'  # Windows equivalent
    expected_class: ai
