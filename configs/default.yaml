# Central config for the pipeline. Every stage (prepare/embed/train/evaluate/classify-commit)
# reads this file so paths and hyperparameters stay in one place.

dataset:
  # Sources are pulled in order until every class hits per_class_cap for that split
  # (see prepare.py): the small real-repository TypeScript data first, then AICD-Bench (fine-grained
  # human/co_authored/ai, see classes.remap); CodeMirage is binary-only and only tops up human/ai.
  #
  # DroidCollection is deliberately NOT included as a separate source: AICD-Bench is
  # built directly on top of Droid (extended + MinHash-deduplicated against it -- see
  # the AICD-Bench paper, arXiv:2602.02079, Sec. 3), so its content is already folded
  # into AICD-Bench. Adding Droid again would only reintroduce near-duplicate rows.
  sources:
    # Real-repository commits signed by coding agents vs pre-2021 human commits, TypeScript (see README).
    # A local build (`aicontrib build-agent-commits`) in `path` is used if present, else the gzipped
    # archives shipped in the repo (51 repositories; see CREDITS.md). Listed first: sources are pulled in
    # order until the caps are reached (see dataset.balance_languages).
    - name: agent_commits
      enabled: true
      adapter: agent_commits
      path: "data/agent_commits"
      archive: ["datasets/agent_commits", "datasets/agent_commits/copyleft"]
      license: "each source repository's own license -- see CREDITS.md (copyleft rows: GPL-3.0/AGPL-3.0)"
      hf_splits: {train: train, validation: validation, test: test}
    - name: aicd_bench
      enabled: true
      adapter: aicd_bench
      hf_repo: "AICD-bench/AICD-Bench"
      hf_config: "T3"          # fine-grained human/machine/hybrid/adversarial task
      # Pinned: the shipped per-row language index (aicontrib/data/aicd_t3_languages.npz) describes
      # exactly this revision. Changing it requires `aicontrib language-census` to rebuild the index.
      hf_revision: "b7dc6d82257de6e0146d1e7b0831abd7088633af"
      # No license on the HF repo, but the paper (arXiv:2602.02079, "Usage Restrictions") says:
      # academic/research use only, commercial use prohibited without the creators' written consent,
      # redistribution not permitted without authorization.
      license: "research-only (per paper)"
      hf_splits: {train: train, validation: validation, test: test}
    - name: codemirage
      enabled: true
      adapter: codemirage
      hf_repo: "HanxiGuo/CodeMirage"
      hf_config: null
      # CC-BY-NC-ND-4.0: non-commercial use only, no redistributing a derivative model.
      # Set enabled: false above to drop it if this stops being a personal/research project.
      license: "cc-by-nc-nd-4.0"
      # No validation split published upstream -- only feeds train/test.
      hf_splits: {train: train, test: test}

  # Per-class row caps, applied per split, summed across all enabled sources. `null` means
  # no cap -- pull every available row from every enabled source. This is the default: a
  # real model should train on the full data, not a capped subset. Full AICD-Bench T3 alone
  # is ~2.1M rows -- days of embedding even on a GPU (see README "Performance"). Don't edit
  # these here: to prototype on a subset, set per_class_cap in configs/local.yaml (see
  # configs/local.example.yaml), which overrides this file and never conflicts with git pull.
  per_class_cap:
    train: null
    validation: null
    test: null

  # Keep only some programming languages, in every split (set this in configs/local.yaml):
  #   languages: {include: [Python, JavaScript, C++, C#]}     keep only these
  #   languages: {exclude: [Rust, Ruby, HTML]}                keep everything but these
  # Names: C, C#, C++, Go, Java, JavaScript, PHP, Python, Rust, Ruby, HTML, TypeScript (case-insensitive;
  # TypeScript only comes from the agent_commits source). Per-language shares of each dataset:
  # aicontrib/data/language_stats.json and README.
  languages: {}
  # true: each language in languages.include gets an equal share of every class's cap -- e.g. 4 languages
  # and a cap of 10000 give 2500 rows per language and class. Without it, shares follow the sources.
  balance_languages: false

classes:
  # Binary: is this code AI-generated or not? AICD-Bench's human/AI "hybrid" code (co_authored) counts
  # as human -- a person wrote part of it. co_authored as a class of its own was the weakest one (F1 ~0.55),
  # and whether a single file is "co-authored" is hard even to define. For the former 3-class model:
  #   names: ["human", "co_authored", "ai"]   and   remap: {}
  # Changing these means re-running prepare, embed and train.
  names: ["human", "ai"]
  remap: {co_authored: human}

# Local repos with known ground-truth authorship, used by `aicontrib evaluate-repo --all`
# (see README "Real-world validation"). Left empty here on purpose: a repo's local path is
# machine-specific and, for a private repo, shouldn't enter git history at all. Copy
# configs/local.example.yaml to configs/local.yaml (gitignored) and add your own entries
# there instead -- they get merged into this list automatically.
known_repos: []

paths:
  raw_cache_dir: "data/raw"
  processed_dir: "data/processed"
  embeddings_dir: "data/embeddings"
  models_dir: "models"
  timeline_cache_dir: "data/timeline_cache"  # per-commit results for `aicontrib report`

embedding:
  # A CodeT5+ embedding model (this one: 135M parameters, trained on 9 languages -- not TypeScript), or
  # a code language model read through its hidden states, e.g. "Qwen/Qwen2.5-Coder-0.5B" (0.5B
  # parameters, ~90 languages including TypeScript; needs representation: hidden, and hidden_layers
  # within its 24 layers, e.g. [12, 18]). Changing it makes `embed` recompute; then re-run `train`.
  model_name: "Salesforce/codet5p-110m-embedding"
  max_length: 512
  batch_size: 32   # samples per batch when classifying commits (report / evaluate-repo)
  # projected: the model's own 256-value embedding. Built so that code doing the same thing gets the
  #   same vector -- which discards style, where an AI fingerprint would be.
  # hidden: the encoder's internal states averaged over the code, for each layer in hidden_layers
  #   (1-12), 768 values per layer. Keeps more surface detail. Changing either setting makes `embed`
  #   recompute (the cache records which one it holds); then re-run `train`.
  representation: projected
  hidden_layers: [6, 12]
  # `embed` sorts samples longest first and batches them by token count (little padding waste).
  # auto: sized from GPU memory (8,192-65,536 tokens; halved automatically on out-of-memory),
  # 16,384 on CPU. Lower it if your GPU runs out of memory anyway.
  max_tokens_per_batch: auto
  # auto: on a GPU, use bf16 (or fp16 if the GPU lacks bf16) when a startup check shows it matches
  # fp32 on that GPU, else fp32. fp32 / bf16 / fp16 force a choice. The CPU always uses fp32.
  precision: auto
  # Save resume progress at least this often. Stopping `embed` loses at most this much work.
  checkpoint_every_seconds: 120

model:
  hidden_dims: [128, 64]
  dropout: 0.2

monitor:
  port: 8765

# Zero-shot detector prototype (`aicontrib binoculars`, see README). Two models sharing a tokenizer:
# a base model (observer) and its instruction-tuned version (performer). The 0.5B pair fits a 4 GB GPU.
binoculars:
  observer: "Qwen/Qwen2.5-Coder-0.5B"
  performer: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  max_tokens: 512       # longer files are scored on their first 512 tokens
  min_tokens: 64        # shorter files are skipped: too little text for a stable score
  files_per_repo: 200   # sampled evenly from each known repo's files at HEAD
  # Vendored and generated code isn't written by the repo's authors (fnmatch patterns on repo paths).
  exclude: ["vendor/*", "*/vendor/*", "node_modules/*", "*/node_modules/*", "dist/*", "build/*",
            "*.min.js", "*.d.ts"]

# Held-out-generator evaluation (`aicontrib generator-holdout`, see README): how well the classifier
# catches code from an AI model it never saw in training. Uses CodeMirage (the only source that
# records the generator) in the languages of dataset.languages: every human row, plus this many
# random rows of each of its 10 generators, per split.
generator_holdout:
  per_generator: {train: 500, test: 300}
  seed: 42

# `aicontrib build-agent-commits` (see README): real commits signed by coding agents, paired with
# human commits from the same repositories, one row per changed file (as classify-commit sees it).
agent_commits:
  index_repo: "balrampandey/qmmit-open-source-agent-commit-index"  # repo list; the code is cloned from GitHub
  index_revision: "a5ae0357a23b617d60e194950cdd18a295ab4c80"
  repo_languages: [TypeScript]  # GitHub's primary language of the repository, as the index records it
  min_signed_commits: 20        # repositories with fewer agent-signed commits are skipped
  max_repos: null               # null: all that qualify (185 TypeScript repos); most agent-active first
  keep_clones: false            # delete each clone once its rows are extracted (they'd add up to many GB)
  ai_since: "2024-01-01"        # agent-signed commits from this date
  human_until: "2021-06-01"     # human commits before this date (GitHub Copilot's preview: June 2021)
  extensions: [.ts, .tsx, .mts, .cts]
  exclude: ["vendor/*", "*/vendor/*", "node_modules/*", "*/node_modules/*", "dist/*", "build/*", "*.min.js",
            "*.d.ts", "*.generated.*", "*.gen.ts", "__generated__/*", "*/__generated__/*"]
  min_changed_lines: 5          # smaller file changes carry too little signal
  max_files_per_commit: 5       # the largest changes, so one huge commit can't dominate a repository
  rows_per_class_per_repo: 150  # each repository gives as many human rows as AI rows, up to this
  human_pool_factor: 3          # human candidates per AI row, to pair each AI row with one of similar size
  split_percent: {validation: 10, test: 15}  # of repositories: a repository is in one split only
  workers: 4                    # repositories processed in parallel
  clone_dir: "data/agent_repos"
  out_dir: "data/agent_commits"

training:
  epochs: 200        # upper bound; early stopping normally ends training well before this
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  # Stop after this many epochs without a new best validation macro-F1. Epochs take seconds (the
  # embeddings are cached) and only the best epoch is saved, so a generous value costs nothing.
  early_stopping_patience: 20
  # When validation macro-F1 hasn't improved for lr_reduce_patience epochs, multiply the learning
  # rate by lr_reduce_factor (never below min_lr). Keep lr_reduce_patience well below
  # early_stopping_patience, so the smaller steps get a chance before training stops.
  lr_reduce_patience: 5
  lr_reduce_factor: 0.5
  min_lr: 0.00001
  seed: 42

commit_classification:
  # Bulk commits (initial imports, vendored code) can touch thousands of files -- ~45 min of CPU
  # embedding for one commit. Only the N files with the most changed lines are classified; they
  # dominate the line-weighted commit aggregate anyway. null = no cap.
  max_files_per_commit: 50
  # Only files with these extensions are fed to the model; everything else (XML, JSON, images,
  # proprietary/binary formats...) is ignored. A commit with no file in this list gets no
  # prediction at all and is excluded from accuracy/timeline percentages.
  supported_extensions:
    .py: python
    .js: javascript
    .jsx: javascript
    .mjs: javascript
    .cjs: javascript
    .ts: typescript   # in the training data only through agent_commits (see README)
    .tsx: typescript
    .mts: typescript
    .cts: typescript
    .cpp: cpp
    .cc: cpp
    .cxx: cpp
    .h: cpp
    .hpp: cpp
    .cs: csharp
